[package]
name = "hubchat"
version.workspace = true
description = "Hubchat — chat with anyone on a mail hub"
authors = ["Orgtree"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hubchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hubchat-core = { path = "../crates/hubchat-core" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
humantime = "2"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# the right-click menu's Paste reads the clipboard natively (text, and pictures as PNG)
arboard = "3"
png = "0.17"

# Linux: the identity key goes to the desktop keyring (Secret Service:
# GNOME Keyring / KWallet); without a backend keyring keeps it only in memory.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# message toasts whose click opens the chat (the version the notification plugin uses)
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation_Collections"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
