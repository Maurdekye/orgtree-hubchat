[package]
name = "hubchat-core"
description = "Hubchat's platform-independent core: mail hub client, identity, transfers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
chacha20poly1305 = "0.10"
humantime = "2"
# the log facade only: the shell (src-tauri trace.rs) owns the subscriber and the files
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 0.42: the first line of rusqlite whose default build also targets the browser
# (wasm32-unknown-unknown, through sqlite-wasm-rs), which Hubchat Web needs.
# `fallible_uint` keeps the u64/usize column conversions 0.32 had built in.
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.17"
# the hub stream (Mail hub 2.5.0): the same rustls trust as reqwest's; native builds only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# the stream's tests (tests/stream.rs) run a fake hub that speaks the WebSocket side
tokio-tungstenite = "0.26"
