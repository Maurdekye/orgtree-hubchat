[package]
name = "hubchat-core"
description = "Hubchat's platform-independent core: mail hub client, identity, transfers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
