[workspace]
resolver = "2"
members = ["src-tauri", "crates/hubchat-core", "crates/hubchat-web", "crates/hubchat-web-server"]

[workspace.package]
version = "1.3.6"
edition = "2021"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Hubchat Web's core (crates/hubchat-web, wasm32-unknown-unknown): every
# visitor downloads it, so small comes before fast.
[profile.web]
inherits = "release"
opt-level = "s"
