# Hubchat release: one pushed tag in, one complete, checked DRAFT GitHub release out. Never publishes.
#
#   build   every platform from the tag (build-*.yml), and Hubchat Web (build-web.yml: the
#           web app's files and its container image); builds only ever hold throwaway keys
#   sign    the real keys, in the protected `release` environment, in a job that runs no
#           project code: apksigner for the APK, the Tauri updater key for every updater file
#   stage   latest.json (merged from the platforms' updater fragments) and SHA256SUMS.txt
#   draft   `gh release create --draft`, then the draft itself is checked as installed apps
#           will check the release (verify-published.mjs in DRAFT mode). Green = "draft
#           ready". Publishing is one manual command for every app's ready draft together
#           (Orgtree's tools/publish-release.mjs); a red draft job leaves the draft, never public.
#
# Modes. A pushed tag v1.2.3 is a real release. A push to ci-test/hubchat-release, or a
# manual run, is a test: the same jobs with throwaway keys in place of the real ones and
# no release at the end; the staged assets are left as the run's artifact. A manual run
# with draft=true also rehearses the draft: a tagless draft named ci-test-draft-<run id>,
# checked the same way and deleted at the end; a push to ci-test/hubchat-release-draft does the same (keep_draft=true leaves it). It never pushes a tag.
# How to cut, check, publish and roll back a release: docs/ci-release.md.
name: release

on:
  push:
    tags: ['v*']
    branches: ['ci-test/hubchat-release', 'ci-test/hubchat-release-draft']   # -draft: a test that also rehearses the draft (as draft=true)
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build as a test (throwaway keys, no release)
        type: string
        required: true
      draft:
        description: Also rehearse the draft (a tagless, hidden draft, checked like a real one)
        type: boolean
        default: false
      keep_draft:
        description: With draft, leave the rehearsal draft instead of deleting it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Check the tag, versions and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - id: check
        # Only a pushed tag is a release. A manual run started from a tag ref is a
        # test too: it builds `inputs.ref`, which need not be the tag's commit.
        env:
          MODE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'test' }}
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .ci-tools/.github/ci/release/check-version.mjs
      - name: Cargo.lock is complete for every platform
        # The builds run cargo without --locked, so an incomplete lockfile would be
        # silently rewritten on each runner; refuse it here instead.
        run: |
          rustup toolchain install nightly-2025-12-12 --profile minimal --no-self-update
          cargo +nightly-2025-12-12 metadata --locked --format-version 1 > /dev/null

  windows:
    needs: resolve
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  macos:
    needs: resolve
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  linux:
    needs: resolve
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  android:
    needs: resolve
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Hubchat Web: the web app's files and its image (no updater entry, nothing to sign).
  # Its artifact is named hubchat-web, so the sign jobs carry it along untouched.
  web:
    needs: resolve
    uses: ./.github/workflows/build-web.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # The only job that ever sees a real key. It runs for pushed tags alone (the `release`
  # environment admits only v* tags) and executes no project code: it installs
  # the pinned Tauri CLI with --ignore-scripts and runs apksigner from the Android SDK.
  sign:
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, windows, macos, linux, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/ci
            package.json
            package-lock.json
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hubchat-*
          path: dist
          merge-multiple: true
      - name: Sign with the release keys
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/ci/release/sign.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  # The same signing code with throwaway keys, so every test run exercises it.
  sign-test:
    if: needs.resolve.outputs.mode == 'test'
    needs: [resolve, windows, macos, linux, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/ci
            package.json
            package-lock.json
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hubchat-*
          path: dist
          merge-multiple: true
      - name: Sign with throwaway keys
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash .github/ci/release/sign.sh dist --throwaway-keys
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  stage:
    needs: [resolve, sign, sign-test]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign-test.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: latest.json, the Hubchat Web files and SHA256SUMS.txt
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: node .ci-tools/.github/ci/release/assemble.mjs dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  # The only job with write access. It uploads exactly what `stage` checked, as a
  # draft, and checks the draft. Publishing is a separate manual command
  # (tools/publish-release.mjs, docs/ci-release.md), run once every app's draft is ready.
  draft:
    # !cancelled(): a release run skips sign-test, and a skipped job also skips every
    # later job whose `if` has no status check of its own, even after stage succeeded.
    if: ${{ !cancelled() && needs.stage.result == 'success' && (needs.resolve.outputs.mode == 'release' || inputs.draft || github.ref == 'refs/heads/ci-test/hubchat-release-draft') }}
    needs: [resolve, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ needs.resolve.outputs.mode }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA: ${{ needs.resolve.outputs.sha }}
      # a rehearsal's draft gets a name no version tag can have, and creates no tag
      DRAFT_TAG: ${{ needs.resolve.outputs.mode == 'release' && needs.resolve.outputs.tag || format('ci-test-draft-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist
      - name: Create the draft release
        id: create
        run: |
          ls -la dist
          drafts() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.draft and .tag_name == \"$DRAFT_TAG\") | .id] | .[]"
          }
          # A re-run after a red check finds the draft it left: never a second one.
          if [ -n "$(drafts)" ]; then
            echo "::error::a draft $DRAFT_TAG already exists (left by an earlier run): check it, or delete it (gh release delete $DRAFT_TAG --repo $GITHUB_REPOSITORY --yes keeps the tag), then re-run"
            exit 1
          fi
          if [ "$MODE" = release ]; then
            target=(--verify-tag)
            notes="docs/release-notes-$VERSION.md"
            title="Hubchat $VERSION"
          else
            target=(--target "$SHA")
            notes="$RUNNER_TEMP/notes.md"
            title="TEST Hubchat $VERSION"
            echo "Rehearsal draft of Hubchat $VERSION at $SHA (run $GITHUB_RUN_ID). Never published." > "$notes"
          fi
          gh release create "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --draft "${target[@]}" \
            --title "$title" --notes-file "$notes" dist/*
          # the API finds no draft by its tag, so it is looked up in the list
          id="$(drafts)"
          if [ -z "$id" ] || [ "$(echo "$id" | wc -l)" != 1 ]; then echo "::error::expected one draft $DRAFT_TAG, found [$id]"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"\(.name) draft=\(.draft) prerelease=\(.prerelease)", (.assets[] | "  \(.name)  \(.size)")'
      - name: Check the draft as an installed app will check the release
        env:
          DRAFT_ID: ${{ steps.create.outputs.id }}
          TAG: v${{ needs.resolve.outputs.version }}
        run: node .ci-tools/.github/ci/release/verify-published.mjs
      - name: Draft ready
        if: env.MODE == 'release'
        run: |
          {
            echo "### Hubchat $VERSION: draft ready"
            echo
            echo "Every asset matches SHA256SUMS.txt, latest.json and its signatures, and build-info-web.json. Nothing is public yet."
            echo "Publish it together with the other apps' ready drafts: \`node tools/publish-release.mjs hubchat=$VERSION ...\` in the Orgtree repository (docs/ci-release.md)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: NOT published, draft left
        if: failure() && env.MODE == 'release'
        run: |
          {
            echo "### Hubchat $VERSION: NOT published, draft left"
            echo
            echo "A step of the draft job failed, so the release is NOT ready. It stays a draft that only the repository's members can see; no update feed points at it."
            echo "Fix the cause, delete the draft (\`gh release delete $TAG --repo $GITHUB_REPOSITORY --yes\` keeps the tag), then re-run the failed jobs."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the rehearsal draft
        if: always() && env.MODE == 'test' && steps.create.outputs.id != '' && !inputs.keep_draft
        env:
          DRAFT_ID: ${{ steps.create.outputs.id }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
          echo "### Rehearsal draft $DRAFT_TAG checked and deleted (no tag was created)" >> "$GITHUB_STEP_SUMMARY"
