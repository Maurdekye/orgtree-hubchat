# Hubchat release: one pushed tag in, one DRAFT GitHub release out. Never publishes.
#
#   build   every platform from the tag (build-*.yml); builds only ever hold throwaway keys
#   sign    the real keys, in the protected `release` environment, in a job that runs no
#           project code: apksigner for the APK, the Tauri updater key for every updater file
#   stage   latest.json (merged from the platforms' updater fragments) and SHA256SUMS.txt
#   draft   `gh release create --draft`: a person checks the draft and publishes it
#
# Modes. A pushed tag v1.2.3 is a real release. A push to ci-test/hubchat-release, or a
# manual run, is a test: the same jobs with throwaway keys in place of the real ones and
# no release at the end; the staged assets are left as the run's artifact.
# How to cut, check, publish and roll back a release: docs/ci-release.md.
name: release

on:
  push:
    tags: ['v*']
    branches: ['ci-test/hubchat-release']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build as a test (throwaway keys, no release)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Check the tag, versions and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - id: check
        env:
          MODE: ${{ github.ref_type == 'tag' && 'release' || 'test' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .ci-tools/.github/ci/release/check-version.mjs

  windows:
    needs: resolve
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  macos:
    needs: resolve
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  linux:
    needs: resolve
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  android:
    needs: resolve
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # The only job that ever sees a real key. It runs for pushed tags alone, waits for
  # the `release` environment's approval, and executes no project code: it installs
  # the pinned Tauri CLI with --ignore-scripts and runs apksigner from the Android SDK.
  sign:
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, windows, macos, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/ci
            package.json
            package-lock.json
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hubchat-*
          path: dist
          merge-multiple: true
      - name: Sign with the release keys
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/ci/release/sign.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  # The same signing code with throwaway keys, so every test run exercises it.
  sign-test:
    if: needs.resolve.outputs.mode == 'test'
    needs: [resolve, windows, macos, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/ci
            package.json
            package-lock.json
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hubchat-*
          path: dist
          merge-multiple: true
      - name: Sign with throwaway keys
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash .github/ci/release/sign.sh dist --throwaway-keys
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  stage:
    needs: [resolve, sign, sign-test]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign-test.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/ci
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: latest.json and SHA256SUMS.txt
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: node .ci-tools/.github/ci/release/assemble.mjs dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  # The only job with write access. It uploads exactly what `stage` assembled, as a
  # draft; publishing is a person's decision (docs/ci-release.md).
  draft:
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ls -la dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Hubchat $VERSION" --notes-file "docs/release-notes-$VERSION.md" dist/*
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,assets \
            --jq '"\(.name) draft=\(.isDraft)", (.assets[] | "  \(.name)  \(.size)")'
