# Android 15+ devices with 16 KB pages refuse/warn on 4 KB-aligned libraries
# (measured on the test phone: "LOAD segment not aligned"). NDK r27 links 4 KB by default.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
